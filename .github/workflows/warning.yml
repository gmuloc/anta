---
name: "PR Warning"

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  warning:
    name: "Display Warning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Option 1: Log Warning (appears in Actions log only)
      - name: Log Warning
        run: |
          echo "::warning::This is a log warning message (no file reference)"

      # Option 5: Check Annotation Warning (appears in check details, not summary box)
      - name: Check Annotation Warning
        run: |
          echo "::warning file=.github/workflows/warning.yml,line=1::This warning appears in check details"

      # Option 6a: Neutral Check Run (gray icon in checks box)
      - name: Create Neutral Check Run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: '⚠️ Neutral Warning Check',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Neutral: This is informational',
                summary: 'This check has a **neutral** conclusion (gray icon)',
                text: 'Neutral checks do not block merging.'
              }
            });

      # Simulate a test against ansible devel (replace with real test)
      - name: Test against ansible devel
        id: devel_test
        continue-on-error: true
        run: |
          # Simulate: this would be your real test command
          # exit 0 = pass, exit 1 = fail
          echo "Running tests against ansible devel branch..."
          exit 1  # Simulating failure for demo

      # Create issue only if devel test failed
      - name: Create issue for devel failure
        if: steps.devel_test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if an issue already exists for this
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ansible-devel-failure'
            });

            if (issues.length > 0) {
              console.log('Issue already exists:', issues[0].html_url);
              // Add a comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing on PR #${context.issue.number} (commit ${context.sha.substring(0, 7)})`
              });
              return;
            }

            // Create new issue
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 CI: ansible devel branch is failing our tests',
              body: `## Ansible Devel Branch Compatibility Issue\n\nOur tests are failing when run against the \`devel\` branch of ansible.\n\n**Triggered by:** PR #${context.issue.number}\n**Commit:** ${context.sha}\n**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n### Next Steps\n1. Check the workflow logs for failure details\n2. Determine if this is an ansible bug or something we need to adapt to\n3. Track upstream issue if needed`,
              labels: ['ansible-devel-failure']
            });

            console.log('Created issue:', issue.html_url);

            // Also comment on the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ Tests against ansible devel branch failed. Tracking issue: #${issue.number}`
            });

      # Option 2: PR Comment (appears in PR conversation)
      - name: PR Comment Warning
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **Warning**: This is a PR comment warning message'
            })

      # Option 3: Job Summary (appears in workflow run summary)
      - name: Job Summary Warning
        run: |
          echo "## ⚠️ Warning" >> $GITHUB_STEP_SUMMARY
          echo "This is a job summary warning message" >> $GITHUB_STEP_SUMMARY

      # Option 4: File-specific Warning (appears on Files changed tab)
      - name: File Warning on Random Changed File
        uses: actions/github-script@v7
        with:
          script: |
            // Get the list of files changed in this PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            if (files.length === 0) {
              core.warning('No files changed in this PR');
              return;
            }

            // Pick a random file
            const randomFile = files[Math.floor(Math.random() * files.length)];
            const filename = randomFile.filename;

            // Emit a warning annotation on line 1 of the random file
            core.warning(`This is a file-specific warning on a randomly selected file`, {
              file: filename,
              startLine: 1
            });
