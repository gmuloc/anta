---
name: "PR Warning"

on:
  pull_request:
    types:
      - opened
      - synchronize
  check_run:
    types:
      - requested_action

jobs:
  # Job that runs on PR events
  warning:
    name: "Display Warning"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Option 1: Log Warning (appears in Actions log only)
      - name: Log Warning
        run: |
          echo "::warning::This is a log warning message (no file reference)"

      # Option 5: Check Annotation Warning (appears in check details, not summary box)
      - name: Check Annotation Warning
        run: |
          echo "::warning file=.github/workflows/warning.yml,line=1::This warning appears in check details"

      # Option 6a: Neutral Check Run (gray icon in checks box)
      - name: Create Neutral Check Run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: '⚠️ Neutral Warning Check',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Neutral: This is informational',
                summary: 'This check has a **neutral** conclusion (gray icon)',
                text: 'Neutral checks do not block merging.'
              }
            });

      # Option 6b: Action Required Check Run with clickable action button
      - name: Create Action Required Check Run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: '🟠 Action Required Check',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'action_required',
              output: {
                title: 'CI: running with devel branch failed',
                summary: 'This check failed. Click the button below to create an issue.',
                text: `**PR:** [#${context.issue.number}](${context.payload.pull_request.html_url})\n**Branch:** ${context.payload.pull_request.head.ref}`
              },
              actions: [
                {
                  label: 'Create Issue',
                  description: 'Create a GitHub issue for this failure',
                  identifier: 'create_issue'
                }
              ]
            });

      # Option 2: PR Comment (appears in PR conversation)
      - name: PR Comment Warning
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **Warning**: This is a PR comment warning message'
            })

      # Option 3: Job Summary (appears in workflow run summary)
      - name: Job Summary Warning
        run: |
          echo "## ⚠️ Warning" >> $GITHUB_STEP_SUMMARY
          echo "This is a job summary warning message" >> $GITHUB_STEP_SUMMARY

      # Option 4: File-specific Warning (appears on Files changed tab)
      - name: File Warning on Random Changed File
        uses: actions/github-script@v7
        with:
          script: |
            // Get the list of files changed in this PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            if (files.length === 0) {
              core.warning('No files changed in this PR');
              return;
            }

            // Pick a random file
            const randomFile = files[Math.floor(Math.random() * files.length)];
            const filename = randomFile.filename;

            // Emit a warning annotation on line 1 of the random file
            core.warning(`This is a file-specific warning on a randomly selected file`, {
              file: filename,
              startLine: 1
            });

  # Job that runs when someone clicks the "Create Issue" button on the check
  create_issue_on_action:
    name: "Create Issue from Check Action"
    if: github.event_name == 'check_run' && github.event.action == 'requested_action' && github.event.requested_action.identifier == 'create_issue'
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue for Failed CI
        uses: actions/github-script@v7
        with:
          script: |
            const checkRun = context.payload.check_run;

            // Find the PR associated with this check run
            let prInfo = '';
            if (checkRun.pull_requests && checkRun.pull_requests.length > 0) {
              const pr = checkRun.pull_requests[0];
              prInfo = `**PR:** [#${pr.number}](https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number})`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 CI: running with devel branch failed',
              body: `## CI Check Failed\n\nThis issue was created because someone clicked "Create Issue" on a failed check.\n\n${prInfo}\n**Commit:** ${checkRun.head_sha}\n**Check:** ${checkRun.name}\n\nPlease investigate and fix the issue.`
            });

            core.info('Issue created successfully!');
